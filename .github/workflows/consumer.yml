# What a consumer's deploy step sees, through coderoot-eth/action against the
# live verify endpoint: an attested release passes, a revoked one is refused
# with exit 1, an unregistered one with exit 2.
#
# A manual run can also check one published npm release: it downloads that
# exact tarball, hashes it, and expects the verdict given.

name: consumer

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also check this npm release, e.g. @coderoot-eth/verify@0.1.0"
        required: false
        default: ""
        type: string
      expect:
        description: "The verdict that release should get"
        required: false
        default: verified
        type: choice
        options: [verified, revoked]
  push:
    branches: [main]
    paths: [".github/workflows/consumer.yml"]
  pull_request:
    paths: [".github/workflows/consumer.yml"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: attested
            release: "@vitrotech/gate-spike-b@0.0.5"
            hash: sha256:7dd824efb4da328856e3a9182cf51af89685ec4c9cb9dd8876eead8348911402
            verdict: verified
            exit-code: "0"
            outcome: success
          - case: revoked
            release: "@vitrotech/gate-spike-a@0.0.3"
            hash: sha256:a7839cbbf036fd2a4ee4fc9c9c6fc90c58f3c15336fa436af0d8900abe17016c
            verdict: revoked
            exit-code: "1"
            outcome: failure
          - case: unregistered
            release: "bytes nobody attested"
            hash: sha256:1111111111111111111111111111111111111111111111111111111111111111
            verdict: unregistered
            exit-code: "2"
            outcome: failure
    name: ${{ matrix.case }}
    steps:
      - name: Verify ${{ matrix.release }}
        id: verify
        continue-on-error: true
        uses: coderoot-eth/action@ff3728e2cee915566aef97b68ae4cec9f0d300c1 # v1.1.0
        with:
          mode: verify
          hash: ${{ matrix.hash }}
      - name: Deploy
        id: deploy
        if: steps.verify.outcome == 'success'
        run: echo "deploying $HASH"
        env:
          HASH: ${{ matrix.hash }}
      - name: The step must answer ${{ matrix.verdict }} and exit ${{ matrix.exit-code }}
        env:
          VERDICT: ${{ steps.verify.outputs.verdict }}
          EXIT_CODE: ${{ steps.verify.outputs.exit-code }}
          OUTCOME: ${{ steps.verify.outcome }}
          DEPLOYED: ${{ steps.deploy.outcome }}
          WANT_VERDICT: ${{ matrix.verdict }}
          WANT_EXIT: ${{ matrix.exit-code }}
          WANT_OUTCOME: ${{ matrix.outcome }}
        run: |
          set -euo pipefail
          echo "verdict=$VERDICT exit=$EXIT_CODE outcome=$OUTCOME deploy=$DEPLOYED"
          [ "$VERDICT" = "$WANT_VERDICT" ] || { echo "::error::expected $WANT_VERDICT, got $VERDICT"; exit 1; }
          [ "$EXIT_CODE" = "$WANT_EXIT" ] || { echo "::error::expected exit $WANT_EXIT, got $EXIT_CODE"; exit 1; }
          [ "$OUTCOME" = "$WANT_OUTCOME" ] || { echo "::error::expected the step to end $WANT_OUTCOME"; exit 1; }
          if [ "$WANT_OUTCOME" = success ]; then [ "$DEPLOYED" = success ]; else [ "$DEPLOYED" = skipped ]; fi

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: ${{ inputs.release }}
    steps:
      - name: Download the release from npm and hash it
        id: tarball
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          case "$RELEASE" in (*@[0-9]*) ;; (*) echo "::error::give name@version"; exit 1;; esac
          file="$(npm pack "$RELEASE" --silent | tail -1)"
          echo "hash=sha256:$(shasum -a 256 "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "$RELEASE -> $file"
      - name: Verify ${{ inputs.release }}
        id: verify
        continue-on-error: true
        uses: coderoot-eth/action@ff3728e2cee915566aef97b68ae4cec9f0d300c1 # v1.1.0
        with:
          mode: verify
          hash: ${{ steps.tarball.outputs.hash }}
      - name: Deploy
        id: deploy
        if: steps.verify.outcome == 'success'
        run: echo "deploying $HASH"
        env:
          HASH: ${{ steps.tarball.outputs.hash }}
      - name: The step must answer ${{ inputs.expect }}
        env:
          VERDICT: ${{ steps.verify.outputs.verdict }}
          EXIT_CODE: ${{ steps.verify.outputs.exit-code }}
          DEPLOYED: ${{ steps.deploy.outcome }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set -euo pipefail
          echo "verdict=$VERDICT exit=$EXIT_CODE deploy=$DEPLOYED"
          [ "$VERDICT" = "$EXPECT" ] || { echo "::error::expected $EXPECT, got $VERDICT"; exit 1; }
          if [ "$EXPECT" = verified ]; then [ "$EXIT_CODE" = 0 ] && [ "$DEPLOYED" = success ]
          else [ "$EXIT_CODE" = 1 ] && [ "$DEPLOYED" = skipped ]; fi
